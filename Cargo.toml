[package]
name = "streambot-local-backend"
version = "0.0.1"
edition = "2024"

[dependencies]
obws = { version = "0.15.0", features = ["events", "builder", "tls"] }
owo-colors = "4.4.0"
serde-saphyr = { version = "2.0.0", features = ["serialize", "deserialize"] }
serde_json = "1.0"
smart-leds = "0.4.0"
spidev = "0.7.1"
twitch_api = "0.8.0"
twitch_oauth2 = "0.17.1"
ws2812-spi = "0.5.1"
chrono = "0.4.45"
redis = { version = "1.8.0", features = ["tokio-comp", "connection-manager"] }
tokio = { version = "1.54.1", features = ["fs", "rt", "rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
notify = "8.2.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "fs"] }

reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query"] }
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"
